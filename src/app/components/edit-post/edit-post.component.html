<div class="form-wrapper">
  <div class="form-container">

    <div class="form-header">
      <button class="btn-back" (click)="goBack()">
        <i class="bi bi-arrow-left"></i> Back
      </button>
      <h1 class="form-title">Edit Post</h1>
      <p class="form-subtitle">Update your story</p>
    </div>

    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
    </div>

    <form *ngIf="!loading" [formGroup]="editForm" (ngSubmit)="onSubmit()" autocomplete="off" class="post-form">

      <div class="field-group">
        <label for="title" class="field-label">Title</label>
        <input
          type="text"
          id="title"
          class="field-input"
          [class.invalid]="title.invalid && title.touched"
          [class.valid]="title.valid && title.touched"
          formControlName="title"
        />
        <div class="field-error" *ngIf="title.invalid && title.touched">
          <span *ngIf="title.errors?.['required']">Title is required</span>
          <span *ngIf="title.errors?.['minlength']">At least 5 characters</span>
          <span *ngIf="title.errors?.['maxlength']">150 characters max</span>
        </div>
      </div>

      <div class="field-group">
        <label for="categoryId" class="field-label">Category</label>
        <select
          id="categoryId"
          class="field-input field-select"
          [class.invalid]="categoryId.invalid && categoryId.touched"
          [class.valid]="categoryId.valid && categoryId.touched"
          formControlName="categoryId"
        >
          <option value="" disabled>Select a category</option>
          <option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </option>
        </select>
        <div class="field-error" *ngIf="categoryId.invalid && categoryId.touched">
          <span *ngIf="categoryId.errors?.['required']">Please select a category</span>
        </div>
      </div>

      <div class="field-group">
        <label for="content" class="field-label">Content</label>
        <textarea
          id="content"
          class="field-input field-textarea"
          [class.invalid]="content.invalid && content.touched"
          [class.valid]="content.valid && content.touched"
          formControlName="content"
          rows="8"
        ></textarea>
        <div class="field-error" *ngIf="content.invalid && content.touched">
          <span *ngIf="content.errors?.['required']">Content is required</span>
          <span *ngIf="content.errors?.['maxlength']">2500 characters max</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="goBack()">
          <i class="bi bi-x"></i> Cancel
        </button>
        <button type="submit" class="btn-publish">
          <i class="bi bi-check-lg"></i> Save changes
        </button>
      </div>

    </form>
  </div>
</div>
