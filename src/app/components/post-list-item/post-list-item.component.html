<article class="post-card" [routerLink]="['/posts', post.id]">
  <div class="post-card-body">
    <div class="post-meta">
      <span class="post-category" *ngIf="post.category">{{ post.category.name }}</span>
      <span class="post-date">{{ post.createdDate | date: 'MMM d, yyyy' }}</span>
    </div>
    <h2 class="post-title">{{ post.title }}</h2>
    <p class="post-excerpt">{{ post.content }}</p>
  </div>
  <div class="post-card-footer">
    <div class="post-divider"></div>
    <div class="post-actions">
      <span class="post-reading">
        <i class="bi bi-clock"></i> {{ post.content | readingTime }}
      </span>
      <div class="action-btns">
        <span class="read-more">Read more <i class="bi bi-arrow-right"></i></span>
        <button class="delete-btn" (click)="onDelete($event)" title="Delete post">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>
</article>
