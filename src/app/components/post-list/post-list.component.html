<div class="list-wrapper">
  <div class="list-header">
    <h1 class="list-title">Latest Posts</h1>
    <p class="list-subtitle">Thoughts, ideas &amp; stories</p>

    <div class="search-bar">
      <i class="bi bi-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        placeholder="Search posts..."
        [value]="searchValue"
        (input)="onSearch($any($event.target).value)"
      />
    </div>

    <div class="category-chips">
      <button
        class="chip"
        [class.active]="selectedCategoryId === null"
        (click)="selectCategory(null)">
        All
      </button>
      <button
        *ngFor="let cat of categories"
        class="chip"
        [class.active]="selectedCategoryId === cat.id"
        (click)="selectCategory(cat.id)">
        {{ cat.name }}
      </button>
    </div>
  </div>

  <div *ngIf="posts.length > 0; else noPosts" class="posts-grid">
    <app-post-list-item
      *ngFor="let post of posts"
      [post]="post"
      (deleted)="onPostDeleted($event)">
    </app-post-list-item>
  </div>

  <ng-template #noPosts>
    <div class="empty-state">
      <i class="bi bi-journal-x empty-icon"></i>
      <p class="empty-title">No posts found</p>
      <p class="empty-sub">Try a different search or category.</p>
    </div>
  </ng-template>
</div>
