<div class="container mt-4">
  <div *ngIf="posts.length > 0; else noPosts">
    <div class="row">
      <div class="col-md-6 col-lg-4 mb-4" *ngFor="let post of posts">
        <app-post-list-item [post]="post"></app-post-list-item>
      </div>
    </div>
  </div>
  <ng-template #noPosts>
    <div class="alert alert-info text-center" role="alert">
      <i class="bi bi-info-circle"></i> No posts available to display.
    </div>
  </ng-template>
</div>
